name: CD - Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server
      uses: appleboy/scp-action@v0.1.3
      with:
        host: course.prafdin.ru
        username: user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2469
        source: "."
        target: "/home/user/catty-reminders-app"
        strip_components: 1

    - name: Deploy with venv
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: course.prafdin.ru
        username: user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2469
        script: |
          set -e
          echo "🚀 Deploying with virtual environment..."
          cd /home/user/catty-reminders-app
          
          echo "🛑 Stopping previous processes..."
          pkill -f "uvicorn.*8181" || true
          sleep 3
          
          echo "🐍 Setting up virtual environment..."
          # Создаем или активируем venv
          python3 -m venv venv 2>/dev/null || true
          source venv/bin/activate
          
          echo "📦 Installing dependencies in venv..."
          pip install -r requirements.txt
          
          echo "🔍 Checking port 8181..."
          # Используем ss вместо netstat
          ss -tln | grep :8181 && echo "❌ Port 8181 occupied" || echo "✅ Port 8181 free"
          
          echo "🚀 Starting application..."
          nohup venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8181 > app.log 2>&1 &
          echo "Application started"
          sleep 10
          
          echo "📋 Status check:"
          pgrep -f "uvicorn.*8181" && echo "✅ Process running" || echo "❌ Process failed"

    - name: Verify deployment
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: course.prafdin.ru
        username: user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2469
        script: |
          echo "=== VERIFICATION ==="
          cd /home/user/catty-reminders-app
          
          echo "1. Process check:"
          if pgrep -f "uvicorn.*8181" > /dev/null; then
            echo "✅ Process RUNNING"
          else
            echo "❌ Process NOT FOUND"
            cat app.log
            exit 1
          fi
          
          echo "2. Port check:"
          if ss -tln | grep :8181 > /dev/null; then
            echo "✅ Port 8181 LISTENING"
          else
            echo "❌ Port NOT LISTENING"
            exit 1
          fi
          
          echo "3. HTTP check:"
          if curl -s http://localhost:8181/ > /dev/null; then
            echo "✅ HTTP access WORKING"
          else
            echo "⚠️ HTTP access failed (might be normal)"
          fi
          
          echo "🎉 SUCCESS! Application deployed on port 8181"
          echo "🌐 Access at: http://app.shavarina.course.prafdin.ru:8181/"