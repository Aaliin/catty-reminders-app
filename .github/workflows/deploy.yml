name: CD - Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy app to remote server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: course.prafdin.ru
          port: 2469
          username: user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Starting application deployment..."

            cd /home/user/catty-reminders-app
            git fetch origin
            git pull origin github-actions

            echo "Installing Python dependencies..."
            source venv/bin/activate

            fuser -k 8181/tcp || true
            pkill -f "uvicorn app.main:app" || true
            sleep 2

            PID=$(lsof -ti:8181) || true
            if [ ! -z "$PID" ]; then
              echo "Stopping process $PID"
              kill $PID || true
              sleep 3
            fi

            echo "Starting application..."
            nohup venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8181 > app.log 2>&1 &

            sleep 10
            if curl -f http://localhost:8181/ > /dev/null 2>&1; then
              echo "Application deployed successfully!"
              echo "Available at: http://app.id.proxy"
              echo "Running on port: 8181"
              
              echo "Process info:"
              ps aux | grep uvicorn | grep -v grep
              echo "Recent logs:"
              tail -20 app.log
              exit 0
            else
              echo "Application health check failed - not responding on port 8181"
              echo "Process tree:"
              ps aux | grep uvicorn
              
              echo "Network status:"
              netstat -tlnp 2>/dev/null | grep 8181 || ss -tlnp 2>/dev/null | grep 8181
              exit 1
            fi