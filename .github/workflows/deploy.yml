name: CD - Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server
      uses: appleboy/scp-action@v0.1.3
      with:
        host: course.prafdin.ru
        username: user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2469
        source: "."
        target: "/home/user/catty-reminders-app"
        strip_components: 1

    - name: Start application
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: course.prafdin.ru
        username: user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2469
        script: |
          cd /home/user/catty-reminders-app
          pkill -f "uvicorn.*8181" || true
          sleep 3
          pip3 install -r requirements.txt --user
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8181 > app.log 2>&1 &
          sleep 15

    - name: Verify deployment
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: course.prafdin.ru
        username: user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2469
        script: |
          echo "=== FINAL VERIFICATION ==="
          cd /home/user/catty-reminders-app
          
          # Критические проверки
          if ! pgrep -f "uvicorn.*8181" > /dev/null; then
            echo "❌ CRITICAL: Application process not running"
            echo "Logs:"
            cat app.log
            exit 1
          fi
          
          if ! netstat -tln | grep :8181 > /dev/null; then
            echo "❌ CRITICAL: Port 8181 not listening"
            exit 1
          fi
          
          if ! curl -s -f http://localhost:8181/ > /dev/null; then
            echo "⚠️ WARNING: HTTP request failed but process is running"
            echo "This might be normal if no root route defined"
          fi
          
          echo "✅ SUCCESS: Basic checks passed"
          echo "📊 Process: $(pgrep -f 'uvicorn.*8181')"
          echo "🌐 Test URL: http://app.shavarina.course.prafdin.ru:8181/"