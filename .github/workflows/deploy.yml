name: CD - Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server
      uses: appleboy/scp-action@v0.1.3
      with:
        host: course.prafdin.ru
        username: user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2469
        source: "."
        target: "/home/user/catty-reminders-app"
        strip_components: 1

    - name: Stop systemd service and start app
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: course.prafdin.ru
        username: user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2469
        script: |
          set -e
          echo "🚀 Stopping systemd service and deploying..."
          cd /home/user/catty-reminders-app
          
          echo "🛑 Stopping systemd user services..." 
          systemctl --user stop catty-app 2>/dev/null || echo "No catty-app service"
          systemctl --user stop uvicorn 2>/dev/null || echo "No uvicorn service"
          systemctl --user stop app 2>/dev/null || echo "No app service"
          systemctl --user stop reminders 2>/dev/null || echo "No reminders service"
          
          systemctl --user list-units | grep -E "(uvicorn|8181|catty|app)" | awk '{print $1}' | while read service; do
            echo "Stopping service: $service"
            systemctl --user stop "$service" 2>/dev/null || true
          done
          sleep 3
          
          echo "🔍 Checking if port is free..."
          if netstat -tln | grep :8181 > /dev/null; then
            echo "❌ Port still occupied, forcing cleanup..."
            sudo fuser -k 8181/tcp 2>/dev/null || true
            sleep 3
          fi
          
          echo "📦 Installing dependencies..."
          pip3 install -r requirements.txt --user
          
          echo "🚀 Starting application..."
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8181 > app.log 2>&1 &
          echo "Application started"
          sleep 10
          
          echo "📋 Status check:"
          pgrep -f "uvicorn.*8181" && echo "✅ Process running" || echo "❌ Process failed"

    - name: Verify deployment
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: course.prafdin.ru
        username: user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2469
        script: |
          echo "=== VERIFICATION ==="
          cd /home/user/catty-reminders-app
          
          if pgrep -f "uvicorn.*8181" > /dev/null && netstat -tln | grep :8181 > /dev/null; then
            echo "🎉 SUCCESS! Application running on port 8181"
            echo "🌐 Access at: http://app.shavarina.course.prafdin.ru:8181/"
          else
            echo "❌ FAILED"
            cat app.log
            exit 1
          fi