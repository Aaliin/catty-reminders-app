name: CD - Deploy to Production - docker

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_lower  }}
  CONTAINER_NAME: catty-app
  PORT: 8181

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy app to remote server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: course.prafdin.ru
          port: 2469
          username: user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Deploying self-contained Docker container ==="
            
            # Verify Docker is available
            if ! command -v docker &> /dev/null; then
              echo "Docker is not installed on the server"
              exit 1
            fi
            
            echo "Docker version:"
            docker --version
            echo "Logging into GitHub Container Registry..."
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u '${{ github.actor }}' --password-stdin
            
            echo "Pulling self-contained Docker image..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            echo "Cleaning up previous deployment..."
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            echo "Starting new container..."
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p ${{ env.PORT }}:${{ env.PORT }} \
              -e ENVIRONMENT=production \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            echo "Cleaning up unused Docker images..."
            docker image prune -f
            
            echo "Waiting for application to start..."
            sleep 30
            
            echo "=== Performing comprehensive health check ==="
            
            CONTAINER_STATUS=$(docker inspect ${{ env.CONTAINER_NAME }} --format='{{.State.Status}}')
            echo "Container status: $CONTAINER_STATUS"
            
            if [ "$CONTAINER_STATUS" != "running" ]; then
              echo "Container is not running"
              docker logs ${{ env.CONTAINER_NAME }}
              exit 1
            fi
            
            echo "Testing application endpoints..."
            if curl -f -s -o /dev/null -w "HTTP: %{http_code}\n" http://localhost:${{ env.PORT }}/ \
               || curl -f -s -o /dev/null -w "HTTP: %{http_code}\n" http://localhost:${{ env.PORT }}/login; then

              echo "DEPLOYMENT SUCCESSFUL"
              echo "========================================"
              echo "Application: http://app.${{ github.repository_owner }}.proxy"
              echo "Container: ${{ env.CONTAINER_NAME }}"
              echo "Port: ${{ env.PORT }}"
              echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
              echo "========================================"
              
              # Show deployment details
              echo "=== Deployment Details ==="
              docker ps --filter "name=${{ env.CONTAINER_NAME }}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              echo "Recent logs:"
              docker logs ${{ env.CONTAINER_NAME }} --tail 10
              
            else
              echo "Health check failed - application not responding"
              echo "=== Debug Information ==="
              echo "Container logs:"
              docker logs ${{ env.CONTAINER_NAME }}
              echo "Network status:"
              netstat -tlnp 2>/dev/null | grep ${{ env.PORT }} || ss -tlnp 2>/dev/null | grep ${{ env.PORT }} || echo "Port not found"
              exit 1
            fi