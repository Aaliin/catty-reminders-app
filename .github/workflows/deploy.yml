name: CD - Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  SERVER_HOST: "course.prafdin.ru"
  SERVER_USER: "user"
  SSH_PORT: 2469

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: github-actions  
        
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: Deploy from github-actions branch
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        ssh-keyscan -p $SSH_PORT $SERVER_HOST >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts
        
        echo "🚀 Deploying from github-actions branch..."
        
        # Обновляем с указанием ветки
        ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "
          echo '📥 Updating from github-actions branch...' &&
          cd /home/user/catty-reminders-app &&
          git fetch origin &&
          git checkout github-actions &&
          git reset --hard origin/github-actions
        "
        
        ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "
          echo '📦 Installing dependencies...' &&
          cd /home/user/catty-reminders-app &&
          pip3 install -r requirements.txt --break-system-packages
        "
        
        ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "
          echo '🔄 Restarting application...' &&
          sudo systemctl restart catty-reminders-app
        "
        
        ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "
          echo '🔍 Checking status...' &&
          sleep 3 &&
          sudo systemctl status catty-reminders-app --no-pager | head -10
        "
        
        echo "🎉 Deployment from github-actions completed!"