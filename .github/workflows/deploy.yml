name: CD - Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server
      uses: appleboy/scp-action@v0.1.3
      with:
        host: course.prafdin.ru
        username: user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2469
        source: "."
        target: "/home/user/catty-reminders-app"
        strip_components: 1

    - name: Start application
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: course.prafdin.ru
        username: user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2469
        script: |
          echo "🚀 Starting deployment..."
          cd /home/user/catty-reminders-app
          pkill -f "uvicorn.*8181" || true
          sleep 3
          pip3 install -r requirements.txt --user
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8181 > app.log 2>&1 &
          sleep 15

    - name: Verify deployment
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: course.prafdin.ru
        username: user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2469
        script: |
          echo "=== 🎯 VERIFICATION ==="
          cd /home/user/catty-reminders-app
          
          echo "Process check:"
          if pgrep -f "uvicorn.*8181" > /dev/null; then
            echo "✅ Process RUNNING: $(pgrep -f 'uvicorn.*8181')"
          else
            echo "❌ Process NOT FOUND"
            echo "=== Logs ==="
            cat app.log
            exit 1
          fi
          
          echo "Port check:"
          if netstat -tln | grep :8181 > /dev/null; then
            echo "✅ Port 8181 LISTENING"
          else
            echo "❌ Port NOT LISTENING"
            exit 1
          fi
          
          echo "HTTP check:"
          curl -s -o /dev/null -w "Status: %{http_code}\n" http://localhost:8181/
          
          echo "🎉 Deployment verified!"

    - name: Final report
      run: |
        echo "✅ DEPLOYMENT COMPLETED"
        echo "🌐 Access your app at: http://app.shavarina.course.prafdin.ru:8181/"
        echo "📊 If the URL doesn't work, check the verification step above"