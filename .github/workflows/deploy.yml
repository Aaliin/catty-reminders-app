name: CD - Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy app to remote server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: course.prafdin.ru
          port: 2469
          username: user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Starting application deployment..."
            
            cd /home/user/catty-reminders-app
            git fetch origin
            git reset --hard origin/main
            
            echo "Installing Python dependencies..."
            source venv/bin/activate
            pip install -r requirements.txt
            
            echo "Restarting application service..."
            sudo systemctl daemon-reload
            sudo systemctl restart catty-reminders.service
            
            sleep 10
            if curl -f http://localhost:8181/ > /dev/null 2>&1; then
              echo "Application deployed successfully!"
              echo "Available at: http://app.shavarina.host"
              echo "Running on port: 8181"
              
              echo "Service status:"
              sudo systemctl status catty-reminders.service --no-pager
            else
              echo "Application health check failed - not responding on port 8181"
              echo "Service status:"
              sudo systemctl status catty-reminders.service --no-pager
              echo "Service logs:"
              sudo journalctl -u catty-reminders.service -n 20 --no-pager
              exit 1
            fi