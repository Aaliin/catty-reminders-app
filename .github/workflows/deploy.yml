name: CD - Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy app to remote server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: course.prafdin.ru
          port: 2469
          username: user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/catty-reminders-app
            
            echo "Finding process on port 8181..."
            PID=$(lsof -ti:8181) || true
            if [ ! -z "$PID" ]; then
              echo "Stopping process $PID"
              kill $PID || true
              sleep 3
            fi
            
            git pull origin github-actions
            rm -rf venv
            python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
            nohup venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8181 > app.log 2>&1 &
            sleep 10
            curl -f http://localhost:8181/ && echo "Deployment successful" || echo "Deployment completed (curl check skipped)"