name: CD - Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  SERVER_HOST: "course.prafdin.ru"
  SERVER_USER: "user"
  SSH_PORT: 2469

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: github-actions
        
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: Deploy application
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -p $SSH_PORT $SERVER_HOST >> ~/.ssh/known_hosts
        
        echo "🚀 Starting deployment..."
        
        ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << 'REMOTE_SCRIPT'
        set -e
        
        APP_DIR="/home/user/catty-reminders-app"
        PORT="8181"
        
        echo "📥 Updating repository..."
        cd "$APP_DIR"
        git fetch origin
        git checkout github-actions
        git reset --hard origin/github-actions
        
        echo "🔍 INVESTIGATION: What's running on the system?"
        echo "=== All python processes ==="
        ps aux | grep python | grep -v grep
        
        echo "=== All processes using port 8181 ==="
        lsof -i :8181 || echo "No processes on port 8181"
        
        echo "=== Network connections ==="
        netstat -tlnp | grep :8181 || echo "No netstat entries for 8181"
        
        echo "🛑 AGGRESSIVE CLEANUP..." 
        echo "Killing all user python processes..."
        pkill -9 -u $USER python 2>/dev/null || true
        pkill -9 -u $USER python3 2>/dev/null || true
        sleep 3
        
        echo "Killing processes by port..."
        sudo fuser -k 8181/tcp 2>/dev/null || true
        lsof -ti:8181 | xargs -r kill -9 2>/dev/null || true
        sleep 3
        
        echo "🔍 VERIFICATION: Check if port is free..."
        if lsof -i :8181 > /dev/null 2>&1; then
            echo "❌ Port 8181 STILL occupied after cleanup"
            echo "=== Current processes ==="
            lsof -i :8181
            sleep 2
        else
            echo "✅ Port 8181 is free, using it"
        fi
        
        echo "📦 Installing Python dependencies..."
        pip3 install -r requirements.txt --break-system-packages
        
        echo "🚀 Starting application on port $PORT..."
        cd "$APP_DIR"
        
        if lsof -i :$PORT > /dev/null 2>&1; then
            echo "❌ CANNOT START: Port $PORT is occupied right before launch!"
            echo "=== Last-second check ==="
            lsof -i :$PORT
            exit 1
        fi
        
        nohup python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT > /home/user/app.log 2>&1 &
        APP_PID=$!
        echo $APP_PID > /home/user/app.pid
        
        echo "⏳ Waiting for startup..."
        sleep 5
        
        echo "🔍 Checking application status..."
        
        if ! ps -p $APP_PID > /dev/null 2>&1; then
            echo "❌ Application process died immediately"
            echo "=== Application logs ==="
            tail -50 /home/user/app.log
            echo "=== Current port status ==="
            lsof -i :$PORT || echo "Port $PORT is free"
            exit 1
        fi
        
        echo "✅ Application process is running (PID: $APP_PID)"
        
        echo "🔍 Testing HTTP response..."
        if curl -s -f http://localhost:$PORT/ > /dev/null 2>&1; then
            echo "✅ Application is responding to HTTP requests"
            echo "🎉 Deployment completed successfully!"
            echo "🌐 Application available at: http://app.shavarina.course.prafdin.ru:$PORT/"
        else
            echo "⚠️ Application running but not responding to HTTP"
            echo "=== Checking why ==="
            netstat -tlnp | grep ":$PORT" || echo "Port $PORT not found in netstat"
            echo "=== Recent logs ==="
            tail -20 /home/user/app.log
        fi
        
        echo "=== Final process check ==="
        ps -p $APP_PID -o pid,user,command
        REMOTE_SCRIPT