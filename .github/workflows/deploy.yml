name: CD - Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  SERVER_HOST: "course.prafdin.ru"
  SERVER_USER: "user"
  SSH_PORT: 2469

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: github-actions
        
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: Simple deploy
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -p $SSH_PORT $SERVER_HOST >> ~/.ssh/known_hosts
        
        echo "🚀 Simple deployment..."
        
        ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "
          cd /home/user/catty-reminders-app
          git fetch origin
          git reset --hard origin/github-actions
          
          pip3 install -r requirements.txt --break-system-packages
          
          pkill -f 'uvicorn' 2>/dev/null || true
          sleep 2
          
          cd /home/user/catty-reminders-app
          nohup python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8181 > /home/user/app.log 2>&1 &
          
          sleep 5
          if curl -s http://localhost:8181/ > /dev/null; then
            echo '✅ App deployed and running!'
            echo '🌐 Available at: http://app.your-id.course.prafdin.ru:8181/'
          else
            echo '❌ App failed to start'
            echo 'Logs:'
            tail -20 /home/user/app.log
            exit 1
          fi
        "