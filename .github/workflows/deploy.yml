name: CD - Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server
      uses: appleboy/scp-action@v0.1.3
      with:
        host: course.prafdin.ru
        username: user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2469
        source: "."
        target: "/home/user/catty-reminders-app"
        strip_components: 1

    - name: Setup and start application
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: course.prafdin.ru
        username: user
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2469
        script: |
          set -e
          echo "🚀 Starting deployment process..."
          cd /home/user/catty-reminders-app
          
          echo "📁 Directory structure:"
          ls -la
          echo "📁 App folder contents:"
          ls -la app/
          
          echo "🛑 Stopping previous processes..."
          pkill -f "uvicorn.*8181" || true
          sleep 3
          
          echo "📦 Installing dependencies..."
          pip3 install -r requirements.txt --user
          
          echo "🚀 Starting application from app/main.py..." 
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8181 > app.log 2>&1 &
          
          echo "⏳ Waiting for startup..."
          sleep 15
          
          echo "🔍 Checking application..."
          if pgrep -f "uvicorn.*8181" > /dev/null; then
            echo "✅ Application process is running"
          else
            echo "❌ Application process not found"
            cat app.log
            exit 1
          fi
          
          echo "🌐 Testing HTTP..."
          if curl -s http://localhost:8181/ > /dev/null; then
            echo "✅ HTTP test passed"
          else
            echo "⚠️ HTTP test failed, checking logs..."
            tail -20 app.log
          fi
          
          echo "🎉 Deployment completed!"
          echo "🌐 Application available at: http://app.shavarina.course.prafdin.ru/"