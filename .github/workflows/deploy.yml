name: CD - Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  SERVER_HOST: "course.prafdin.ru"
  SERVER_USER: "user"
  SSH_PORT: 2469

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: github-actions
        
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: Takeover port 8181
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -p $SSH_PORT $SERVER_HOST >> ~/.ssh/known_hosts
        
        echo "🚀 Taking over port 8181 for Catty App..."
        
        ssh -p $SSH_PORT $SERVER_USER@$SERVER_HOST << 'REMOTE_SCRIPT'
        set -e
        
        PORT="8181"
        APP_NAME="catty-reminders-app"
        
        echo "=== Checking current processes on port $PORT ==="
        lsof -i :$PORT || echo "No processes found"
        
        echo "Stopping application processes..."
        pkill -f "uvicorn.*$PORT" 2>/dev/null || true
        sleep 3
        
        if lsof -i :$PORT > /dev/null 2>&1; then
            echo "Force killing remaining processes..."
            pkill -9 -f "uvicorn.*$PORT" 2>/dev/null || true
            sleep 2
        fi
      
        if lsof -i :$PORT > /dev/null 2>&1; then
            echo "❌ WARNING: Port $PORT still occupied"
            lsof -i :$PORT
        else
            echo "✅ Port $PORT is now free"
        fi
        REMOTE_SCRIPT

    - name: Deploy application
      run: |
        echo "🚀 Deploying Catty App on port 8181..."
        
        ssh -p $SSH_PORT $SERVER_USER@$SERVER_HOST << 'DEPLOY_SCRIPT'
        set -e
        
        APP_DIR="/home/user/catty-reminders-app"
        PORT="8181"
        LOG_FILE="/home/user/app.log"
        PID_FILE="/home/user/app.pid"
        
        echo "📥 Updating application code..."
        cd "$APP_DIR"
        git fetch origin
        git checkout github-actions
        git reset --hard origin/github-actions
        
        echo "🐍 Setting up Python environment..."
        if [ ! -d "$VENV_DIR" ]; then
            echo "Creating virtual environment..."
            python3 -m venv "$VENV_DIR"
        fi
        
        source "$VENV_DIR/bin/activate"
        
        echo "📦 Installing dependencies..."
        pip install --upgrade pip
        pip install -r requirements.txt
        
        echo "🔧 Testing application..."
        if ! python3 -c "from app.main import app; print('✅ App imports successfully')"; then
            echo "❌ Application import failed"
            exit 1
        fi
        
        echo "🚀 Starting application..."
        pkill -f "uvicorn.*$PORT" 2>/dev/null || true
        sleep 3
        
        cd "$APP_DIR"
        nohup python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT > "$LOG_FILE" 2>&1 &
        APP_PID=$!
        echo $APP_PID > "$PID_FILE"
        
        echo "⏳ Waiting for application to start..."
        for i in {1..10}; do
            if curl -s http://localhost:$PORT/ > /dev/null 2>&1; then
                echo "✅ Application started successfully after ${i}s"
                break
            fi
            sleep 2
        done
        
        if curl -s -f http://localhost:$PORT/ > /dev/null; then
            echo "🎉 DEPLOYMENT SUCCESSFUL!"
            echo "🌐 Application available at: http://app.shavarina.course.prafdin.ru:8181/"
            
            echo "=== Recent logs ==="
            tail -10 "$LOG_FILE"
        else
            echo "❌ DEPLOYMENT FAILED - Application not responding"
            echo "=== Application logs ==="
            tail -30 "$LOG_FILE"
            exit 1
        fi
        DEPLOY_SCRIPT