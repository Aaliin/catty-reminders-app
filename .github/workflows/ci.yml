name: Python CI docker_lab

on:
  push:
    branches: [master, github-actions, docker_lab]
  pull_request:
    branches: [master, github-actions, docker_lab]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          pip install pytest pytest-playwright fastapi uvicorn jinja2 requests
        fi

    - name: Install Playwright browsers
      run: |
        python -m playwright install
        python -m playwright install-deps

    - name: Start FastAPI app      
      run: |      
        echo "Starting FastAPI app..."
        nohup uvicorn app.main:app --host 0.0.0.0 --port 8181 &
        echo "FastAPI app starting on port 8181..."
        sleep 10
        
    - name: Check if app is running
      run: |
        curl -f http://localhost:8181/ || curl -f http://localhost:8181/docs || echo "App health check - continuing..."

    - name: Run unit tests
      run: |
        echo "Running unit tests..."
        if [ -f "tests/test_unit.py" ]; then
          python -m pytest tests/test_unit.py -v
        else
          echo "No unit tests found"
        fi
        
    - name: Run API tests
      run: |
        echo "Running API tests..."
        if [ -f "tests/test_api.py" ]; then
          python -m pytest tests/test_api.py -v
        else
          echo "No API tests found"
        fi
        
    - name: Run all tests
      run: |
        echo "Running all tests..."
        if [ -d "tests" ]; then
          python -m pytest tests/ -v --tb=short
        else
          echo "No tests directory found"
        fi

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Lint Dockerfile with Hadolint
      continue-on-error: true
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
        failure-threshold: warning
        no-fail: true

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=sha,prefix=
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name == 'push' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
