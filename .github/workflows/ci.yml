name: Python CI

on:
  push:
    branches: [master, github-actions]
  pull_request:
    branches: [master, github-actions]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          pip install fastapi uvicorn pytest playwright
        fi
        
    - name: Start FastAPI app      
      run: |      
        echo "Starting FastAPI app..."
        nohup uvicorn app.main:app --host 0.0.0.0 --port 8181 &
        echo "FastAPI app starting on port 8181..."
        sleep 10
        
    - name: Check if app is running
      run: |
        curl -f http://localhost:8181/ || curl -f http://localhost:8181/docs || echo "App health check - continuing..."

    - name: Run unit tests
      run: |
        echo "Running unit tests..."
        if [ -f "tests/test_unit.py" ]; then
          python -m pytest tests/test_unit.py -v
        else
          echo "No unit tests found"
        fi
        
    - name: Run API tests
      run: |
        echo "Running API tests..."
        if [ -f "tests/test_api.py" ]; then
          python -m pytest tests/test_api.py -v
        else
          echo "No API tests found"
        fi
        
    - name: Run all tests
      run: |
        echo "Running all tests..."
        if [ -d "tests" ]; then
          python -m pytest tests/ -v --tb=short
        else
          echo "No tests directory found"
        fi